services:
  mongodb:
    image: mongo:7.0
    container_name: media_mongodb
    restart: unless-stopped
    command: ["mongod", "--wiredTigerCacheSizeGB", "4"]
    ports:
      # Restricted to localhost (127.0.0.1) to prevent public internet access on OVHcloud
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?Configure the existing database username}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?Configure the existing database password}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-media_db}
    volumes:
      # Persistent MongoDB data stored directly on the 1TB Block Storage volume
      - ${STORAGE_DIR:-/mnt/storage}/mongodb:/data/db
    networks:
      - media_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    image: mongo-express:latest
    container_name: media_mongo_express
    restart: unless-stopped
    ports:
      # Bound to MONGO_EXPRESS_BIND (defaults to 127.0.0.1 for SSH tunnel security; switch to 0.0.0.0 for public access)
      - "${MONGO_EXPRESS_BIND:-127.0.0.1}:8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_INITDB_ROOT_USERNAME:?Configure the existing database username}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?Configure the existing database password}
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASS:?Configure Mongo Express password}
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - media_net

  backend:
    build: &backend_build
      context: ./backend
      dockerfile: Dockerfile
    container_name: media_backend
    restart: unless-stopped
    init: true
    shm_size: 8g
    ports:
      - "127.0.0.1:8000:8000"
    environment: &backend_environment
      - MONGODB_URL=mongodb://${MONGO_INITDB_ROOT_USERNAME:?Configure the existing database username}:${MONGO_INITDB_ROOT_PASSWORD:?Configure the existing database password}@mongodb:27017/${MONGO_INITDB_DATABASE:-media_db}?authSource=admin
      - DATABASE_NAME=${MONGO_INITDB_DATABASE:-media_db}
      - ENABLE_EXTERNAL_URLS=${ENABLE_EXTERNAL_URLS:-false}
      - PYTHONDONTWRITEBYTECODE=1
      - MEDIA_WORKER_CONCURRENCY=${MEDIA_WORKER_CONCURRENCY:-4}
      - STORAGE_DIR=${STORAGE_DIR:-/mnt/storage}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?Configure the original JWT key}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_DEFAULT_PASSWORD=${ADMIN_DEFAULT_PASSWORD:?Configure the initial administrator password}
      - GOOGLE_CREDENTIALS_FILE=${GOOGLE_CREDENTIALS_FILE:-/mnt/storage/config/credentials.json}
      - GOOGLE_TOKEN_FILE=${GOOGLE_TOKEN_FILE:-/mnt/storage/config/token.json}
      - GOOGLE_DRIVE_FOLDER_ID=${GOOGLE_DRIVE_FOLDER_ID:-}
      - RESERVED_CPU_CORES=${RESERVED_CPU_CORES:-1}
      - FFMPEG_THREADS=${FFMPEG_THREADS:-}
      - TOTAL_RAM_GB=${TOTAL_RAM_GB:-32}
      - RESERVED_RAM_RATIO=${RESERVED_RAM_RATIO:-0.10}
      - CLOUD_PIPELINE_RAM_RATIO=${CLOUD_PIPELINE_RAM_RATIO:-0.90}
      - MAX_CONCURRENT_FFMPEG=${MAX_CONCURRENT_FFMPEG:-4}
    volumes:
      # Mount 1TB block storage for media, metadata, and database
      - ${STORAGE_DIR:-/mnt/storage}:${STORAGE_DIR:-/mnt/storage}
      - ./backend:/app:ro
      - ./frontend:/frontend:ro
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - media_net

  media-worker:
    build: *backend_build
    container_name: media_worker
    restart: unless-stopped
    init: true
    command: ["python", "-m", "media_worker"]
    environment: *backend_environment
    volumes:
      - ${STORAGE_DIR:-/mnt/storage}:${STORAGE_DIR:-/mnt/storage}
      - ./backend:/app:ro
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - media_net

  jdownloader:
    image: jlesage/jdownloader-2:latest
    container_name: media_jdownloader
    restart: unless-stopped
    shm_size: 4g
    ports:
      # Bound to JDOWNLOADER_BIND (defaults to 127.0.0.1 for SSH tunnel security; switch to 0.0.0.0 for direct browser access)
      - "${JDOWNLOADER_BIND:-127.0.0.1}:5800:5800"
    environment:
      - USER_ID=1000
      - GROUP_ID=1000
      - VNC_PASSWORD=${JDOWNLOADER_PASSWORD:?Configure JDownloader password}
      - JVM_OPTIONS=-Xms1024m -Xmx4096m
    volumes:
      # Persistent configuration & JDownloader settings on 1TB block storage
      - ${STORAGE_DIR:-/mnt/storage}/jdownloader:/config
      # Dedicated Folder Watch volume for auto-crawling jobs
      - ${STORAGE_DIR:-/mnt/storage}/jdownloader/folderwatch:/watchfolder
      # Downloads land directly in the video directory
      - ${STORAGE_DIR:-/mnt/storage}/videos:/output
    networks:
      - media_net

  nginx:
    image: nginx:alpine
    container_name: media_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - media_net

networks:
  media_net:
    driver: bridge
