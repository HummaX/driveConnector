user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Do not log query strings; media credentials should never be recorded in access logs.
    log_format safe '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log safe;
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    client_max_body_size 2m;
    upstream backend_nodes { server backend:8000; keepalive 32; }
    server {
        listen 80;
        server_name _;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        location = /api/auth/login { limit_req zone=login burst=5 nodelay; proxy_pass http://backend_nodes; }
        location = /api/login { limit_req zone=login burst=5 nodelay; proxy_pass http://backend_nodes; }
        location /ws/transfers {
            proxy_pass http://backend_nodes;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
            proxy_read_timeout 86400s;
        }
        location /api/stream/ { proxy_pass http://backend_nodes; proxy_buffering off; proxy_read_timeout 86400s; }
        location / { proxy_pass http://backend_nodes; proxy_read_timeout 300s; }
    }
}
